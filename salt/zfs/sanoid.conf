# Managed by Salt
{%- for dataset, opts in datasets.items() %}

[{{ dataset }}]
{%- for k, v in opts.items() %}
	{{ k }} = {{ v }}
{%- endfor %}
{%- endfor %}
{%- for name, opts in templates.items() %}

[template_{{ name }}]
{%- for k, v in opts.items() %}
	{{ k }} = {{ v }}
{%- endfor %}
{%- endfor %}